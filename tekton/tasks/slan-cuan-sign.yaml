---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slan-cuan-sign
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Security
    tekton.dev/displayName: "slan-cuan: Sign Artifacts"
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/platforms: "linux/amd64"
    tekton.dev/tags: "release,maven,sign,security"
spec:
  description: >-
    Sign Java artifacts using Konflux middleware-signing pipeline.
  params:
    - name: SIGN_REPO_URL
      description: Pullspec of image containing Maven repository.
      type: string
    - name: SIGNING_KEY
      description: Signing key name.
      type: string
    - name: REQUESTER_ID
      description: Requester identity for signing operations.
      type: string
      default: "slan-cuan@redhat.com"
    - name: ZIP_ROOT_PATH
      description: Root of Maven repo tree inside ZIP.
      type: string
      default: "repository"
    - name: PRODUCT_KEY
      description: Product key for metadata.
      type: string
      default: "slan-cuan"
    - name: IGNORE_PATTERNS
      description: Comma-separated regex patterns to ignore during signing.
      type: string
      default: ""
    - name: REGISTRY_AUTH_SECRET
      description: K8s Secret name for registry auth (.dockerconfigjson format).
    - name: DIRECT_SIGN
      description: Whether to sign the repository directly via internal-request pipeline.
      type: string
      default: "true"
    - name: DIRECT_SIGN_PIPELINE_NAME
      description: The name of the internal-request pipeline to use for signing.
      type: string
      default: "middleware-signing"
    - name: DIRECT_SIGN_TASK_GIT_URL
      description: The url to the git repo where the internal-request task is stored.
      type: string
      default: "https://gitlab.cee.redhat.com/signing/signing.git"
    - name: DIRECT_SIGN_TASK_GIT_REVISION
      description: The branch name for the git repo where the internal-request task is stored.
      type: string
      default: c3f0ea4dbdb4f177e9f4347271b54ec0ee99273d
    - name: DIRECT_SIGN_VERBOSE
      description: Enable verbose Kerberos diagnostics for direct signing.
      type: string
      default: "false"
    - name: sourceDataArtifact
      description: Trusted Artifact URI of the extracted artifact directory from slan-cuan-extract.
      type: string
    - name: ociStorage
      description: The OCI repository where the Trusted Artifact is stored.
      type: string
      default: "empty"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls.
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      description: The url to the git repo where the release-service-catalog stepactions are stored.
      type: string
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: catalogGitRevision
      description: The revision in the catalogGitUrl repo to be used.
      type: string
      default: production
  results:
    - name: sourceDataArtifact
      description: Trusted Artifact URI of the extracted artifact directory.
      type: string
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: false
  steps:
    - name: use-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/extracted
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: run
      image: quay.io/light-castle/slan-cuan:latest
      imagePullPolicy: Always
      args:
        - --verbose
        - sign
      env:
        - name: SLAN_CUAN_SIGN_REPO_URL
          value: $(params.SIGN_REPO_URL)
        - name: SLAN_CUAN_SIGN_REPO_PATH
          value: /var/workdir/extracted/build-output.zip
        - name: SLAN_CUAN_SIGN_SIGNING_KEY
          value: $(params.SIGNING_KEY)
        - name: SLAN_CUAN_SIGN_OUTPUT_PATH
          value: /var/workdir/signed
        - name: SLAN_CUAN_SIGN_REQUESTER_ID
          value: $(params.REQUESTER_ID)
        - name: SLAN_CUAN_SIGN_ZIP_ROOT_PATH
          value: $(params.ZIP_ROOT_PATH)
        - name: SLAN_CUAN_SIGN_PRODUCT_KEY
          value: $(params.PRODUCT_KEY)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN
          value: $(params.DIRECT_SIGN)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN_PIPELINE_NAME
          value: $(params.DIRECT_SIGN_PIPELINE_NAME)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN_TASK_GIT_URL
          value: $(params.DIRECT_SIGN_TASK_GIT_URL)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN_TASK_GIT_REVISION
          value: $(params.DIRECT_SIGN_TASK_GIT_REVISION)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN_VERBOSE
          value: $(params.DIRECT_SIGN_VERBOSE)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN_TASK_TA_STORAGE
          value: $(params.ociStorage)
        - name: SLAN_CUAN_SIGN_DIRECT_SIGN_TASK_TA_SOURCE_ARTIFACT
          value: $(params.sourceDataArtifact)
        - name: SLAN_CUAN_SIGN_IGNORE_PATTERNS
          value: $(params.IGNORE_PATTERNS)
        - name: SLAN_CUAN_SIGN_REGISTRY_AUTH_FILE
          value: /auth/.dockerconfigjson
        - name: SLAN_CUAN_TEKTON_RESULTS_DIR
          value: /tekton/results
      volumeMounts:
        - name: registry-auth
          mountPath: /auth
          readOnly: true
    - name: create-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: /var/workdir/signed
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
  volumes:
    - name: workdir
      emptyDir: {}
    - name: registry-auth
      secret:
        secretName: $(params.REGISTRY_AUTH_SECRET)
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
