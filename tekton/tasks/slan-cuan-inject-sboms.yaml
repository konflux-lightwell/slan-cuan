---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slan-cuan-inject-sboms
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build
    tekton.dev/displayName: "slan-cuan: Inject Enriched SBOMs"
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/platforms: "linux/amd64"
    tekton.dev/tags: "release,maven,sbom"
spec:
  description: >-
    Inject enriched CycloneDX SBOMs from generate-security-metadata
    into build-output.zip before signing. Each enriched SBOM replaces
    the PNC SBOM entry at the same GAV path inside the zip, wherever the
    zip roots its repository; every other entry is kept as it is. No new
    entries are added. When no enriched SBOMs are present, passes
    through the original signing artifact unchanged.
  params:
    - name: signingDataArtifact
      description: >-
        Trusted Artifact URI containing build-output.zip from extract.
      type: string
    - name: securityMetadataArtifact
      description: >-
        Trusted Artifact URI containing security metadata (enriched
        SBOMs, OSV, VEX) from generate-security-metadata. When empty,
        no injection occurs.
      type: string
      default: ""
    - name: ZIP_ROOT_PATH
      description: >-
        Unused; kept for pipeline compatibility. The target entry is found
        by its GAV path suffix, independent of the zip's root directory.
      type: string
      default: "repository"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifact is stored.
      type: string
      default: "empty"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls.
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      description: The url to the git repo where the release-service-catalog stepactions are stored.
      type: string
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: catalogGitRevision
      description: The revision in the catalogGitUrl repo to be used.
      type: string
      default: production
  results:
    - name: signingDataArtifact
      description: >-
        Trusted Artifact URI of the (possibly modified) build-output.zip.
        Passed to the sign task as its signingDataArtifact input.
      type: string
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: false
  steps:
    - name: use-signing-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/extracted
        - name: sourceDataArtifact
          value: $(params.signingDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: use-security-metadata-artifact
      when:
        - input: $(params.securityMetadataArtifact)
          operator: notin
          values: [""]
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/security-metadata
        - name: sourceDataArtifact
          value: $(params.securityMetadataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: inject-enriched-sboms
      image: quay.io/konflux-ci/konflux-test:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        ENRICHED_DIR="${ENRICHED_DIR:-/var/workdir/security-metadata/enriched-sboms}"
        ZIP="${ZIP:-/var/workdir/extracted/build-output.zip}"
        WORK="$(mktemp -d /tmp/inject-sboms.XXXXXX)"
        trap 'rm -rf "$WORK"' EXIT

        # Only GAV-shaped SBOMs are injected:
        #   <group path>/<artifactId>/<version>/<artifactId>-<version>.bom.json
        # CycloneDX VEX documents share the .bom.json suffix but are named
        # CVE-<id>-<datetime>.bom.json / <datetime>.bom.json and must never
        # be injected as SBOMs.
        list_sboms() {
          [ -d "$ENRICHED_DIR" ] || return 0
          find "$ENRICHED_DIR" -mindepth 4 -type f -name '*.bom.json' |
            while IFS= read -r f; do
              version_dir="$(dirname "$f")"
              version="$(basename "$version_dir")"
              artifact="$(basename "$(dirname "$version_dir")")"
              if [ "$(basename "$f")" = "${artifact}-${version}.bom.json" ]; then
                printf '%s\n' "$f"
              else
                echo "  Skipping non-SBOM $(basename "$f")" >&2
              fi
            done
        }

        sbom_list="$(list_sboms)"
        if [ -z "$sbom_list" ]; then
          echo "No enriched SBOMs to inject; passing through original artifact"
          exit 0
        fi

        # The zip is never expanded: list its entries, stage only the
        # replacement SBOMs under their exact entry names, and update those
        # entries in place. zip copies every other entry unchanged.
        unzip -Z1 "$ZIP" > "$WORK/entries"
        mkdir "$WORK/stage"
        : > "$WORK/replace"

        while IFS= read -r enriched; do
          rel="${enriched#"$ENRICHED_DIR"/}"
          if [[ "$rel" == *".."* ]]; then
            echo "ERROR: path traversal in enriched SBOM path: $rel" >&2
            exit 1
          fi

          # The PNC SBOM entry for this GAV, whatever prefix the zip uses
          # (e.g. build-output/repository/<rel>).
          awk -v rel="$rel" \
            '$0 == rel || (length($0) > length(rel) &&
              substr($0, length($0) - length(rel)) == "/" rel)' \
            "$WORK/entries" > "$WORK/match"
          matches=$(wc -l < "$WORK/match")
          if [ "$matches" -eq 0 ]; then
            echo "WARNING: no $rel entry in build-output.zip; not injected" >&2
            continue
          fi
          if [ "$matches" -gt 1 ]; then
            echo "ERROR: $rel matches $matches zip entries:" >&2
            cat "$WORK/match" >&2
            exit 1
          fi
          entry="$(cat "$WORK/match")"
          if [[ "$entry" == /* || "$entry" == *".."* ]]; then
            echo "ERROR: unsafe zip entry name: $entry" >&2
            exit 1
          fi

          mkdir -p "$WORK/stage/$(dirname "$entry")"
          cp "$enriched" "$WORK/stage/$entry"
          printf '%s\n' "$entry" >> "$WORK/replace"
          echo "  Replacing $entry"
        done <<< "$sbom_list"

        count=$(wc -l < "$WORK/replace")
        if [ "$count" -eq 0 ]; then
          echo "No matching SBOM entries; passing through original artifact"
          exit 0
        fi

        # -nw: names are literal (no wildcards); -X: no extra attributes.
        (cd "$WORK/stage" && zip -q -nw -X "$ZIP" -@ < "$WORK/replace")

        echo "Injected $count enriched SBOM(s) into build-output.zip"
    - name: create-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: /var/workdir/extracted
        - name: sourceDataArtifact
          value: $(results.signingDataArtifact.path)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
