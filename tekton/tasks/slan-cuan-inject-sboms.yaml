---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slan-cuan-inject-sboms
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build
    tekton.dev/displayName: "slan-cuan: Inject Enriched SBOMs"
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/platforms: "linux/amd64"
    tekton.dev/tags: "release,maven,sbom"
spec:
  description: >-
    Inject enriched CycloneDX SBOMs from generate-security-metadata
    into build-output.zip before signing. Each enriched SBOM replaces
    the PNC SBOM entry at the same GAV path inside the zip, wherever the
    zip roots its repository; every other entry is kept as it is. No new
    entries are added. When no enriched SBOMs are present, passes
    through the original signing artifact unchanged.
  params:
    - name: signingDataArtifact
      description: >-
        Trusted Artifact URI containing build-output.zip from extract.
      type: string
    - name: securityMetadataArtifact
      description: >-
        Trusted Artifact URI containing security metadata (enriched
        SBOMs, OSV, VEX) from generate-security-metadata. When empty,
        no injection occurs.
      type: string
      default: ""
    - name: ZIP_ROOT_PATH
      description: >-
        Unused; kept for pipeline compatibility. The target entry is found
        by its GAV path suffix, independent of the zip's root directory.
      type: string
      default: "repository"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifact is stored.
      type: string
      default: "empty"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls.
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      description: The url to the git repo where the release-service-catalog stepactions are stored.
      type: string
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: catalogGitRevision
      description: The revision in the catalogGitUrl repo to be used.
      type: string
      default: production
  results:
    - name: signingDataArtifact
      description: >-
        Trusted Artifact URI of the (possibly modified) build-output.zip.
        Passed to the sign task as its signingDataArtifact input.
      type: string
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: false
  steps:
    - name: use-signing-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/extracted
        - name: sourceDataArtifact
          value: $(params.signingDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: use-security-metadata-artifact
      when:
        - input: $(params.securityMetadataArtifact)
          operator: notin
          values: [""]
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/security-metadata
        - name: sourceDataArtifact
          value: $(params.securityMetadataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: run
      image: quay.io/light-castle/slan-cuan:latest
      imagePullPolicy: Always
      args:
        - inject-sboms
      env:
        - name: SLAN_CUAN_INJECT_SBOMS_ZIP_PATH
          value: /var/workdir/extracted/build-output.zip
        - name: SLAN_CUAN_INJECT_SBOMS_ENRICHED_DIR
          value: /var/workdir/security-metadata/enriched-sboms
    - name: create-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: /var/workdir/extracted
        - name: sourceDataArtifact
          value: $(results.signingDataArtifact.path)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
